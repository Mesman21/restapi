version: '3.8'

services:
  web:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - mongo
      - redis
  
  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
  
  redis:
    image: redis:latest
    ports:
      - "6379:6379"

  locust:
    image: locustio/locust
    container_name: library_locust
    ports:
      - "8089:8089" 
    volumes:
      - ./locustfile.py:/mnt/locust/locustfile.py
    command: -f /mnt/locust/locustfile.py --Web-host 0.0.0.0
    depends_on:
      - web 

volumes:
  mongo_data: